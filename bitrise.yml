format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

workflows:
  build-debug-apk:
    description: Builds a debug APK you can install straight onto an Android phone.
    steps:
      - git-clone@8: {}
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: ./gradlew
      - android-build@1:
          inputs:
            - module: app
            - variant: debug
            - build_type: apk
      - deploy-to-bitrise-io@2: {}
